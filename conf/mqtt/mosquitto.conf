# mosquitto.conf - Configuración básica

# Puerto MQTT estándar
listener 1883

# Puerto WebSocket (para apps web)
listener 9001
protocol websockets

# Permitir conexiones anónimas (SOLO DESARROLLO)
# En producción, configurar autenticación
allow_anonymous true

# Persistencia de mensajes
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Tipo de logs
log_type error
log_type warning
log_type notice
log_type information

# Conexiones
max_connections -1
