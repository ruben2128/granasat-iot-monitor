  grafana_rad:
    container_name: grafana_rad
    image: grafana/grafana
    user: "0"
    ports:
      - "3003:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./log/grafana:/var/log/grafana
    restart: always
    networks:
      - RadiacionN

  mqtt_rad:
    container_name: mqtt_rad
    image: eclipse-mosquitto:latest
    user: "0"
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./conf/mqtt/:/mosquitto/config/
      - ./data/mqtt/:/mosquitto/data/
      - ./log/mqtt/:/mosquitto/log/
    restart: always
    networks:
      - RadiacionN

  postgres_rad:
    container_name: postgres_rad
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tfg_iot
      POSTGRES_USER: tfg_user
      POSTGRES_PASSWORD: tfg_password_seguro_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfg_user -d tfg_iot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - RadiacionN

  backend_rad:
    container_name: backend_rad
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data:ro
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres_rad
      DB_PORT: 5432
      DB_NAME: tfg_iot
      DB_USER: tfg_user
      DB_PASSWORD: tfg_password_seguro_2024
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: eVASuizyVUt-kbzFC8SDKrp_6ifHrDO0eYerjl7w6dmmn8mWMXZzO9wE-cIDCvNPQRvHtHILfCMC2JPIb-77HQ==
      INFLUX_ORG: RadiationMonitor
      INFLUX_BUCKET: RadiationMonitorBucket
      JWT_SECRET: mi_secreto_super_seguro_cambiar_en_produccion_123456
      JWT_EXPIRES_IN: 24h
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: gilrubenmartin@gmail.com
      SMTP_PASS: ogjrrxmkgonuhbsl
      FRONTEND_URL: https://radiacion.granasat.space
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radiacion-api.rule=Host(`radiacion.granasat.space`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.radiacion-api.tls=true"
      - "traefik.http.services.radiacion-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.radiacion-api.tls.certresolver=resolver"
    depends_on:
      postgres_rad:
        condition: service_healthy
    restart: always
    networks:
      - traefik
      - RadiacionN
      - mqtt_MQTT
  frontend_rad:
    container_name: frontend_rad
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://radiacion.granasat.space/api
    ports:
      - "3002:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radiacion.rule=Host(`radiacion.granasat.space`)"
      - "traefik.http.routers.radiacion.tls=true"
      - "traefik.http.services.radiacion.loadbalancer.server.port=3000"
      - "traefik.http.routers.radiacion.tls.certresolver=resolver"
    depends_on:
      - backend_rad
    restart: always
    networks:
      - traefik
      - RadiacionN

networks:
  traefik:
    external: true
    name: traefik
  RadiacionN:
    driver: bridge
    ipam:
      config:
        - subnet: 192.169.162.0/24
  mqtt_MQTT:
    external: true